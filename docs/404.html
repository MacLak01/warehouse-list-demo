      rel="stylesheet"
    />
    <script>
      (function () {
        var key = 'theme-mode';
        var stored = localStorage.getItem(key);
        var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
        var palettes = {
          light: {
            bg: '#f8f9fa',
            bg_secondary: '#e9ecef',
            text: '#0a0a0a',
            text_secondary: '#495057',
            border: '#ced4da',
            accent: '#ff4500',
            success: '#10b981',
            warning: '#f59e0b',
            error: '#ef4444',
            info: '#3b82f6',
          },
          dark: {
            bg: '#050505',
            bg_secondary: '#121212',
            text: '#ffffff',
            text_secondary: '#a3a3a3',
            border: '#222222',
            accent: '#ff4500',
            success: '#00ff41',
            warning: '#ffaa00',
            error: '#ff0033',
            info: '#00d2ff',
          },
        };
        var p = palettes[theme];
        var r = document.documentElement;
        r.setAttribute('data-theme', theme);
        r.classList.toggle('dark', theme === 'dark');
        r.classList.toggle('light', theme === 'light');
        r.style.setProperty('--color-bg', p.bg);
        r.style.setProperty('--color-bg-secondary', p.bg_secondary);
        r.style.setProperty('--color-text', p.text);
        r.style.setProperty('--color-text-secondary', p.text_secondary);
        r.style.setProperty('--color-border', p.border);
        r.style.setProperty('--color-accent', p.accent);
        r.style.setProperty('--color-success', p.success);
        r.style.setProperty('--color-warning', p.warning);
        r.style.setProperty('--color-error', p.error);
        r.style.setProperty('--color-info', p.info);
      })();
    </script>
